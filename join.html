<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a group on PayCheck</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="You're invited to a PayCheck group">
<meta property="og:description" content="Show up or pay up. Tap to join in the PayCheck app.">
<style>
  :root { --ink: #14151a; --muted: #5d5f6b; --canvas: #f7f5f0; --card: #ffffff; --line: #e6e2d8; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2f1ee; --muted: #a3a4ad; --canvas: #121317; --card: #1c1d22; --line: #2c2d33; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--canvas); color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 32px; line-height: 1.1; margin: 6px 0 12px; letter-spacing: -.02em; }
  p { margin: 0 0 12px; color: var(--muted); }
  p strong { color: var(--ink); }
</style>
</head>
<body>
<main>
  <div class="eyebrow">PayCheck</div>
  <h1>You're invited<br>to a group.</h1>
  <p>Invite links open in the PayCheck app on iPhone.</p>
  <p><strong>Don't have it yet?</strong> Install PayCheck, sign in, then come back and tap the invite link again.</p>
  <p><strong>Already have it?</strong> Go back and press and hold the link, then choose <em>Open in PayCheck</em>.</p>
</main>
</body>
</html>
